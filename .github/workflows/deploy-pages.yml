# Build-only on karguvel7.github.io — never deploy to gh-pages.
# Production deploy: repo karguvel7/talking-portfolio uses deploy-talking-portfolio-pages.yml on main.

name: Build talking portfolio

on:
  push:
    branches:
      - talking-video-portfolio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-talking-portfolio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: talking-portfolio-out
          path: out/
          retention-days: 14
