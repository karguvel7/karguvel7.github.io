<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="milkyBand" gradientUnits="userSpaceOnUse" x1="80" y1="120" x2="1520" y2="780">
      <stop offset="0%" stop-color="rgba(2,4,12,0)"/><stop offset="18%" stop-color="rgba(8,12,28,0.02)"/><stop offset="34%" stop-color="rgba(180,195,230,0.045)"/><stop offset="44%" stop-color="rgba(220,228,245,0.11)"/><stop offset="50%" stop-color="rgba(235,240,255,0.14)"/><stop offset="56%" stop-color="rgba(210,218,240,0.09)"/><stop offset="66%" stop-color="rgba(140,160,210,0.04)"/><stop offset="82%" stop-color="rgba(2,4,12,0)"/>
    </linearGradient>
    <linearGradient id="milkyCore" gradientUnits="userSpaceOnUse" x1="400" y1="300" x2="1200" y2="600">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="bandSoft" x="-15%" y="-40%" width="130%" height="180%">
