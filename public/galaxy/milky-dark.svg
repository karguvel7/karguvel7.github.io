      <stop offset="0%" stop-color="transparent"/><stop offset="28%" stop-color="rgba(120,150,255,0.03)"/><stop offset="42%" stop-color="rgba(210,220,255,0.09)"/><stop offset="50%" stop-color="rgba(190,170,255,0.13)"/><stop offset="58%" stop-color="rgba(220,235,255,0.08)"/><stop offset="68%" stop-color="rgba(130,180,255,0.05)"/><stop offset="82%" stop-color="transparent"/>
